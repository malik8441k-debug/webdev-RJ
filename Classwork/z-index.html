<!DOCTYPE html>
<html>
<head>
<style>
img {
  position: absolute;
  left: 0px;
  top: 0px;
  z-index: -1;
}
</style>
</head>
<body>

<h1>This is a heading</h1>
<img src="whatsapp-image-2024-10-06-at-09.34.13.jpeg" alt="Background Image" width="600" height="400">
<p>Because the image has a z-index of -1, it will be placed behind the text.</p>

</body>
</html>

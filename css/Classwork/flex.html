<!DOCTYPE html>
<html>
<head>
<style>
.container {
  display: flex;
  flex-direction: column-reverse;
  gap: 20px;
  background-color: rgb(35, 198, 46);
}

.container div {
  
  background-color: #221e1e;
  margin: 10px;
  padding: 20px;
  font-size: 26px;
}
</style>
</head>
<body>

<h1>Create a Flex Container</h1>

<div class="container">
  <div>Dabba 1</div>
  <div>Dabba 2</div>
  <div>Dabba 3</div>  
</div>

<p>Flexbox must have a parent element with the display property set to flex or inline-flex.</p>
<p>Direct child elements of the flex container automatically becomes flex items.</p>

</body>
</html>

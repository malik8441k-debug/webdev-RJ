<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
  margin: 0;
  overflow: hidden;
}

.photo {
  position: relative;
  width: 100vw;
  height: 100vh;
  color: white;
  font-family: sans-serif;
  font-weight: bold;

}

.photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}


.row-top, .row-mid, .row-bot {
  position: absolute;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-between; 
  padding: 16px; 
}


.row-top { 
  top: 0; 
}

.row-mid { 
  top: calc(50% - 20px); 
}

.row-bot { 
  bottom: 0; 
}

        

    </style>
</head>

<body>
   <div class="photo">
  <img src="b503ecec-2943-48cd-9f68-eed764f6ddce.jpeg" alt="Background Photo">
  

  <div class="row-top">
    <div>Ranjan Kumar</div>
    <div>Ranjan Kumar</div>
    <div>Ranjan Kumar</div>
  </div>
  

  <div class="row-mid">
    <div>Ranjan Kumar</div>
    <div>Ranjan Kumar</div>
    <div>Ranjan Kumar</div>
  </div>
  
 
  <div class="row-bot">
    <div>Ranjan Kumar</div>
    <div>Ranjan Kumar</div>
    <div>Ranjan Kumar</div>
  </div>
</div>

    
</body>
</html>
